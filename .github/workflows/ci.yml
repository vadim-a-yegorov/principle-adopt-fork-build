name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check structure
        run: |
          test -f README.md
          test -f LICENSE
          test -f CONTRIBUTING.md
          test -f CODE_OF_CONDUCT.md
          test -f CHANGELOG.md
          test -f software-development/never-reinvent-the-wheel/SKILL.md
      - name: Validate skill markdown
        run: |
          head -20 software-development/never-reinvent-the-wheel/SKILL.md | grep -q "never-reinvent-the-wheel"
